name: kernel build

on:
  workflow_dispatch:
    inputs:
      repository: { description: 'Repo', required: true, default: 'rezadinosaurus/android_kernel_qcom_sm8250' }
      branch: { description: 'Branch', required: true, default: 'lineage-latte' }
      defconfig: { description: 'Defconfig', required: true, default: 'vendor/alioth_defconfig' }
      ksu: { description: 'Enable KernelSU', required: false, type: boolean, default: true }
      kernelsu_branch: { description: 'KSU Branch', required: false, default: 'master' }
      nomount: { description: 'Enable nomount', required: false, type: boolean, default: true }
      nomount_branch: { description: 'Nomount Branch', required: false, default: 'master' }

env:
  CHAT_ID: ${{ secrets.CHAT_ID }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  KBUILD_BUILD_USER: "lloromannic"
  KBUILD_BUILD_HOST: "stargaze"
  CLANG_URL: "https://github.com/moonooen/AOSP20/releases/download/v1.0/clang-r547379-qssi.tar.gz"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.repository }}
        ref: ${{ github.event.inputs.branch }}
        submodules: recursive

    - name: Start Notification
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendMessage" \
        -d chat_id="${{ env.CHAT_ID }}" \
        -d text="build is starting sayangg: ${{ github.event.inputs.repository }} [${{ github.event.inputs.branch }}] (AOSP Clang 20)"

    - name: Cache Clang
      uses: actions/cache@v4
      with:
        path: tc/clang
        key: clang-r547379-qssi

    - name: Setup and Build
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3 git wget curl device-tree-compiler zstd xz-utils

        export TZ="Asia/Jakarta"
        BUILD_TIME=$(date +'%H%M-%d%m%y')
        echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV

        CLANG_DIR=$PWD/tc/clang
        if [ ! -x "$CLANG_DIR/bin/clang" ]; then
          mkdir -p "$CLANG_DIR"
          wget -q "$CLANG_URL" -O tc/clang.tar.gz
          if tar -tzf tc/clang.tar.gz | grep -q '^\(\./\)\?bin/clang$'; then
            tar -xzf tc/clang.tar.gz -C "$CLANG_DIR"
          else
            tar -xzf tc/clang.tar.gz -C "$CLANG_DIR" --strip-components=1
          fi
          rm -f tc/clang.tar.gz
        fi

        if [ ! -x "$CLANG_DIR/bin/clang" ]; then
          echo "ERROR: Clang not found"
          find "$CLANG_DIR" -maxdepth 3 -type f | sort | head -100
          exit 1
        fi

        export PATH=$CLANG_DIR/bin:$PATH
        clang --version | head -n1

        if [ "${{ github.event.inputs.ksu }}" = "true" ]; then
          echo "Setting up KernelSU [${{ github.event.inputs.kernelsu_branch }}]"
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s ${{ github.event.inputs.kernelsu_branch }}
        fi

        if [ "${{ github.event.inputs.nomount }}" = "true" ]; then
          echo "Setting up nomount [${{ github.event.inputs.nomount_branch }}]"
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/${{ github.event.inputs.nomount_branch }}/kernel/setup.sh" | bash -
        fi

        export ARCH=arm64
        ARGS="O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 KCFLAGS=-Wno-error"

        make $ARGS ${{ github.event.inputs.defconfig }}
        make -j$(nproc) $ARGS dtbs dtboimage || true
        make $ARGS dtb.img || true
        make -j$(nproc) $ARGS 2>&1 | tee compile.log

        if [ -f out/arch/arm64/boot/Image ]; then
          ZIP_NAME="imell-$BUILD_TIME.zip"
          mkdir -p dts_output
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} ./ \;

          for f in *.dtb; do
            [ -f "$f" ] && dtc -I dtb -O dts -o "dts_output/${f}.dts" "$f"
          done

          [ -f out/arch/arm64/boot/dtb.img ] && cp out/arch/arm64/boot/dtb.img ./
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img ./
          cp out/arch/arm64/boot/Image ./

          zip -r "$ZIP_NAME" Image *.dtb *.img dts_output/
          echo "FINAL_ZIP=$ZIP_NAME" >> $GITHUB_ENV
        fi

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-${{ env.BUILD_TIME }}
        path: |
          *.log
          *.zip
        retention-days: 1

    - name: Telegram Notification
      if: always()
      run: |
        [ -f "compile.log" ] && curl -s -F document=@"compile.log" "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendDocument" -F chat_id="${{ env.CHAT_ID }}" -F caption="Build log"
        [ -f "${{ env.FINAL_ZIP }}" ] && curl -s -F document=@"${{ env.FINAL_ZIP }}" "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendDocument" -F chat_id="${{ env.CHAT_ID }}" -F caption="build done sayangg!!!"
