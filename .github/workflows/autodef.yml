name: defconfigs gen

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Kernel repository"
        required: true
        default: "rezadinosaurus/android_kernel_qcom_sm8250"
      branch:
        description: "Kernel branch"
        required: true
        default: "lineage-base"

env:
  KBUILD_BUILD_USER: "lloromannic"
  KBUILD_BUILD_HOST: "stargaze"
  CLANG_URL: "https://github.com/moonooen/AOSP20/releases/download/v1.0/clang-r547379-qssi.tar.gz"

jobs:
  defconfig:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repository }}
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 python-is-python3 git wget curl device-tree-compiler \
            zstd xz-utils zip

      - name: Cache Clang
        uses: actions/cache@v4
        with:
          path: tc/clang
          key: clang-r547379-qssi

      - name: Setup Clang
        shell: bash
        run: |
          set -e
          CLANG_DIR="$GITHUB_WORKSPACE/tc/clang"

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            mkdir -p "$CLANG_DIR"
            wget -q "$CLANG_URL" -O "$GITHUB_WORKSPACE/clang.tar.gz"
            tar -xzf "$GITHUB_WORKSPACE/clang.tar.gz" -C "$CLANG_DIR"
            rm -f "$GITHUB_WORKSPACE/clang.tar.gz"
          fi

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            echo "ERROR: Clang not found"
            find "$CLANG_DIR" -maxdepth 3 -type f | sort | head -100
            exit 1
          fi

          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "TC_BIN=$CLANG_DIR/bin" >> "$GITHUB_ENV"

          "$CLANG_DIR/bin/clang" --version | head -n1

      - name: Generate all defconfigs
        shell: bash
        run: |
          set -e
          chmod +x scripts/update_defconfig
          ./scripts/update_defconfig all

      - name: Verify generated defconfigs
        shell: bash
        run: |
          set -e

          DEVICES="alioth apollo cas cmi dagu elish enuma lmi munch umi thyme psyche"

          MAKE_ARGS=(
            ARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            KCFLAGS=-Wno-error
          )

          for DEVICE in $DEVICES; do
            echo "=== Verifying: $DEVICE ==="
            test -f "arch/arm64/configs/${DEVICE}_defconfig"
            rm -rf "verify-$DEVICE"

            make O="verify-$DEVICE" "${MAKE_ARGS[@]}" "${DEVICE}_defconfig" \
              || make O="verify-$DEVICE" "${MAKE_ARGS[@]}" "vendor/${DEVICE}_defconfig"

            rm -rf "verify-$DEVICE"
            echo "OK: $DEVICE"
          done

      - name: Show defconfig changes
        shell: bash
        run: |
          git status --short
          git diff -- arch/arm64/configs

      - name: Package all defconfigs
        shell: bash
        run: |
          set -e
          mkdir -p defconfig-output

          for DEVICE in alioth apollo cas cmi dagu elish enuma lmi munch umi thyme psyche; do
            cp "arch/arm64/configs/${DEVICE}_defconfig" "defconfig-output/${DEVICE}_defconfig"
          done

          (cd defconfig-output && zip -r ../defconfigs-all.zip .)
          ls -lh defconfigs-all.zip

      - name: Upload defconfigs
        uses: actions/upload-artifact@v4
        with:
          name: all-generated-defconfigs
          path: |
            defconfigs-all.zip
            defconfig-output/
          retention-days: 7
